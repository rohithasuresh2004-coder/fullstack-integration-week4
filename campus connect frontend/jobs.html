<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="CampusConnect – one portal for campus placements and internships.">
<title>Browse Jobs | CampusConnect</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="header"></div>
<main id="main" class="container">
<div class="page-head"><h1>Browse jobs &amp; internships</h1><p class="meta" id="count" aria-live="polite"></p></div>
<form class="search-row" role="search" id="searchForm"><label class="visually-hidden" for="q">Search jobs</label><input id="q" type="search" placeholder="Search by title, company or skill…"><button class="btn" type="submit">Search</button></form>
<div class="layout">
 <aside class="card filters" aria-label="Filters"><h2 style="margin:0;font-size:1.15rem">Filters</h2>
  <fieldset><legend>Job type</legend><label class="check"><input type="checkbox" name="type" value="Full-time"> Full-time</label><label class="check"><input type="checkbox" name="type" value="Internship"> Internship</label></fieldset>
  <label for="loc">Location</label><select id="loc"><option value="">All locations</option></select>
  <p style="margin-top:1rem"><button class="btn btn-outline btn-sm" type="button" id="reset">Clear filters</button></p></aside>
 <section aria-label="Job results" id="results"></section>
</div></main>
<div id="footer"></div>
<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/jobs.js"></script>
</body>
</html>
